name: Compile database

on:
  push:
    branches:
      - main
    paths:
      - "data/**/*.json"
      - "scripts/compile_database.js"
      - ".github/workflows/compile-database.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile database.js
        run: node scripts/compile_database.js

      - name: Commit compiled database
        run: |
          if git diff --quiet -- data/database.js; then
            echo "database.js is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/database.js
          git commit -m "chore: compile database"
          git push
