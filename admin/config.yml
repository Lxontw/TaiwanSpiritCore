backend:
  name: github
  repo: Lxontw/TaiwanSpiritCore
  branch: main

local_backend: true

media_folder: "assets/images"
public_folder: "assets/images"

collections:
  - name: "fuzhe"
    label: "福澤蛙 (Fuzhe)"
    folder: "data/fuzhe"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.id}}"
    fields: &entry_fields
      - { label: "識別 ID", name: "id", widget: "string" }
      - { label: "主題", name: "theme", widget: "select", options: ["fuzhe", "plants", "monsters", "talismans", "temples"] }
      - { label: "分類", name: "category", widget: "string" }
      - { label: "名稱 / 標題", name: "title", widget: "string" }
      - { label: "副標題", name: "subtitle", widget: "string", required: false }
      - label: "元數據 (Meta)"
        name: "meta"
        widget: "object"
        fields:
          - { label: "等級 (Level)", name: "level", widget: "string", required: false }
          - { label: "圖片狀態 (Status)", name: "status", widget: "select", options: ["已放圖片", "圖片待補"], default: "圖片待補", required: false }
      - label: "內容 (Content)"
        name: "content"
        widget: "object"
        fields:
          - { label: "摘要說明", name: "summary", widget: "text", required: false }
          - label: "主要分佈區域"
            name: "regions"
            widget: "list"
            required: false
            field: { label: "區域", widget: "string" }
          - label: "流傳都市與脈絡"
            name: "cities"
            widget: "list"
            required: false
            field: { label: "城市/脈絡", widget: "string" }
          - label: "相關地景"
            name: "landscapes"
            widget: "list"
            required: false
            field: { label: "地景", widget: "string" }
          - label: "台灣靈格轉化"
            name: "transformations"
            widget: "list"
            required: false
            field: { label: "轉化可能", widget: "string" }
          - label: "造型提示"
            name: "tips"
            widget: "list"
            required: false
            field: { label: "提示", widget: "string" }
      - { label: "圖片路徑", name: "image", widget: "image", required: false }
      - label: "資料來源 (Source)"
        name: "source"
        widget: "object"
        required: false
        fields:
          - { label: "來源標籤", name: "label", widget: "string", required: false }
          - { label: "來源連結 (URL)", name: "url", widget: "string", required: false }

  - name: "plants"
    label: "植物 (Plants)"
    folder: "data/plants"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.id}}"
    fields: *entry_fields

  - name: "monsters"
    label: "精怪地景 (Monsters)"
    folder: "data/monsters"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.id}}"
    fields: *entry_fields

  - name: "talismans"
    label: "符咒法器 (Talismans)"
    folder: "data/talismans"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.id}}"
    fields: *entry_fields

  - name: "temples"
    label: "廟宇神靈 (Temples)"
    folder: "data/temples"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.id}}"
    fields: *entry_fields
