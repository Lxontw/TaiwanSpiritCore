<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>《台灣靈格》後台管理系統 - Static CMS</title>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <!-- 載入 Static CMS 的 CSS 資源 -->
    <link href="https://unpkg.com/@staticcms/app@3.0.0/dist/main.css" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        background: #111113;
        color: #f0f0f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .cms-boot-status {
        max-width: 720px;
        padding: 24px;
        color: #c8a84b;
        font-size: 14px;
        line-height: 1.7;
      }

      .cms-boot-status strong {
        display: block;
        margin-bottom: 8px;
        color: #f0f0f5;
        font-size: 18px;
      }

      .cms-boot-status code {
        color: #f0f0f5;
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="cms-boot-status" class="cms-boot-status">
      <strong>正在載入《台灣靈格》後台...</strong>
      若畫面停在這裡，請確認瀏覽器允許載入 <code>unpkg.com</code> 與 GitHub 登入視窗。
    </div>
    <!-- 載入 Static CMS 的 JS 資源 -->
    <script src="https://unpkg.com/@staticcms/app@3.0.0/dist/static-cms-app.js"></script>
    <script>
      window.addEventListener('load', function () {
        var status = document.getElementById('cms-boot-status');
        function showError(message) {
          status.innerHTML = '<strong>Static CMS 載入失敗</strong>' + message;
        }
        try {
          var cms = window.CMS || window.StaticCMS || window.NetlifyCmsApp || window.netlifyIdentity;
          if (cms && typeof cms.init === 'function') {
            cms.init();
            return;
          }
          showError('找不到 Static CMS 初始化物件。請檢查 Static CMS CDN 是否被瀏覽器外掛或網路阻擋。');
        } catch (error) {
          showError('<code>' + String(error && error.message ? error.message : error) + '</code>');
          console.error(error);
        }
      });
    </script>
  </body>
</html>
